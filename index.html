<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>ماموریت قهرمان ستاره‌ها 🌟</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap');

  :root{
    --bg1:#140b2e;
    --bg2:#2a1657;
    --gold:#ffcf5c;
    --pink:#ff4d6d;
    --mint:#5be6d0;
    --cream:#fdf3e3;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%;
    font-family:'Vazirmatn',sans-serif;
    background:var(--bg1);
    color:var(--cream);
    overflow:hidden;
    user-select:none;
  }
  #app{ position:relative; width:100%; height:100vh; height:100dvh; overflow:hidden; }
  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center; z-index:10;
  }
  .hidden{ display:none !important; }

  h1{
    font-size:clamp(26px,8vw,40px);
    font-weight:900; margin:0 0 10px; color:var(--gold);
    text-shadow:0 2px 0 rgba(0,0,0,.3);
  }
  p.sub{
    font-size:clamp(14px,4vw,17px);
    opacity:.9; max-width:320px; line-height:2; margin:0 0 22px;
  }
  input#nameInput{
    font-family:inherit; font-size:18px; text-align:center;
    border:none; border-radius:999px; padding:13px 20px;
    width:min(260px,78vw); margin-bottom:16px;
    background:rgba(255,255,255,.12); color:var(--cream); outline:2px solid transparent;
  }
  input#nameInput:focus{ outline-color:var(--gold); background:rgba(255,255,255,.18); }
  input#nameInput::placeholder{ color:rgba(253,243,227,.5); }

  button.btn{
    font-family:inherit; font-weight:700; font-size:18px; color:#241242;
    background:linear-gradient(180deg,var(--gold),#e0a530);
    border:none; border-radius:999px; padding:15px 38px; cursor:pointer;
    box-shadow:0 6px 0 #b47b16, 0 10px 20px rgba(0,0,0,.35);
    transition:transform .1s ease;
  }
  button.btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #b47b16,0 4px 10px rgba(0,0,0,.3); }
  button.btn:focus-visible{ outline:3px solid var(--mint); outline-offset:3px; }

  canvas#previewCanvas, canvas#endCanvas{ margin-bottom:8px; }

  canvas#gameCanvas{
    position:absolute; inset:0; z-index:2; display:block; touch-action:none;
    width:100%; height:100%;
  }

  #hud{
    position:absolute; top:0; left:0; right:0; z-index:6;
    display:flex; align-items:flex-start; justify-content:space-between;
    padding:14px 18px; pointer-events:none;
  }
  .hud-pill{
    font-weight:700; font-size:14px; background:rgba(0,0,0,.3);
    padding:7px 14px; border-radius:999px;
  }
  #hudRight{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  #hudLeft{ display:flex; flex-direction:column; align-items:flex-start; gap:6px; }
  #stageLabel{ font-size:12px; opacity:.8; }
  #livesRow{ display:flex; gap:4px; }
  #livesRow svg{ width:18px; height:18px; }

  #bossBarWrap{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:min(220px,50vw); height:12px; border-radius:999px;
    background:rgba(0,0,0,.4); overflow:hidden; z-index:6; display:none;
    border:1px solid rgba(255,255,255,.15);
  }
  #bossBarFill{
    height:100%; width:100%; border-radius:999px;
    background:linear-gradient(90deg,#ff4d6d,#ff8a3d);
    transition:width .25s ease;
  }

  #shootBtn{
    position:absolute; bottom:34px; left:50%; transform:translateX(-50%);
    width:78px; height:78px; border-radius:50%; z-index:7;
    background:radial-gradient(circle at 35% 30%, #7ee8d8, #22a08f 70%);
    border:3px solid rgba(255,255,255,.35);
    box-shadow:0 6px 18px rgba(0,0,0,.4), inset 0 -4px 8px rgba(0,0,0,.25);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#0c2b26; font-weight:800; font-size:11px; gap:2px;
    transition:transform .08s ease;
  }
  #shootBtn:active{ transform:translateX(-50%) scale(.9); }
  #shootBtn svg{ width:22px; height:22px; }

  #comboText{
    position:absolute; top:70px; left:50%; transform:translateX(-50%);
    font-weight:900; font-size:26px; color:var(--pink); text-shadow:0 2px 6px rgba(0,0,0,.4);
    z-index:6; opacity:0; pointer-events:none;
  }

  #stageBanner{
    position:absolute; inset:0; z-index:9;
    display:flex; align-items:center; justify-content:center;
    background:rgba(10,5,25,.55);
    opacity:0; pointer-events:none;
    transition:opacity .35s ease;
  }
  #stageBanner.show{ opacity:1; }
  #stageBannerText{
    font-size:clamp(18px,5.6vw,26px); font-weight:900; color:var(--gold);
    text-shadow:0 2px 0 rgba(0,0,0,.35); max-width:310px; line-height:1.7;
  }

  #endTextBlock{ opacity:0; transition:opacity .8s ease; display:flex; flex-direction:column; align-items:center; }
  #endTextBlock.reveal{ opacity:1; }

  .final-msg{
    font-size:clamp(15px,4.4vw,18px); font-weight:700; color:var(--mint);
    margin:10px 0 6px; text-shadow:0 1px 0 rgba(0,0,0,.25);
    max-width:330px; line-height:2; white-space:pre-line;
  }
  .score-line{ font-size:14px; opacity:.85; margin-bottom:20px; }

  #vignette{
    position:absolute; inset:0; pointer-events:none; z-index:5;
    background:radial-gradient(circle, transparent 60%, rgba(200,40,40,0) 100%);
    transition:background .15s ease;
  }
</style>
</head>
<body>
<div id="app">

  <!-- INTRO MESSAGE -->
  <div id="intro" class="screen">
    <h1>سلام قهرمان! 🌟</h1>
    <p class="sub">تو امروز انتخاب شدی تا دنیا رو نجات بدی.<br>گربه‌ها تو خطرن، آسمون پر از ستاره‌های گمشده‌ست و یه رئیس بد هم منتظرته... آماده‌ای؟</p>
    <button class="btn" id="introBtn">بعدی</button>
  </div>

  <!-- NAME ENTRY -->
  <div id="nameScreen" class="screen hidden">
    <canvas id="previewCanvas" width="160" height="170"></canvas>
    <h1 style="font-size:clamp(20px,6vw,28px)">اسم قهرمان داستان چیه؟</h1>
    <input id="nameInput" type="text" placeholder="اسمت رو بنویس" maxlength="20">
    <p class="sub" style="font-size:13px; margin-bottom:10px;">با کشیدن انگشتت حرکت کن و پرش بزن، با دکمه‌ی ⚡ دشمن‌ها رو بزن!</p>
    <button class="btn" id="startBtn">شروع ماموریت 🚀</button>
  </div>

  <!-- GAME -->
  <div id="gameWrap" class="hidden" style="position:absolute; inset:0;">
    <canvas id="gameCanvas"></canvas>
    <div id="vignette"></div>
    <div id="bossBarWrap"><div id="bossBarFill"></div></div>
    <div id="hud">
      <div id="hudLeft">
        <div class="hud-pill" id="timer">۳۰</div>
        <div id="livesRow"></div>
      </div>
      <div id="hudRight">
        <div class="hud-pill" id="scoreBox">امتیاز: ۰</div>
        <div id="stageLabel">ماموریت ۱</div>
      </div>
    </div>
    <div id="comboText"></div>
    <div id="stageBanner"><div id="stageBannerText"></div></div>
    <button id="shootBtn">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2l2.2 6.8H21l-5.6 4.1 2.2 6.9L12 15.8 6.4 19.8l2.2-6.9L3 8.8h6.8L12 2z" fill="#0c2b26"/></svg>
      شلیک
    </button>
  </div>

  <!-- END -->
  <div id="end" class="screen hidden">
    <canvas id="confettiCanvas" style="position:absolute; inset:0; z-index:1; pointer-events:none;"></canvas>
    <div style="position:relative; z-index:2; display:flex; flex-direction:column; align-items:center;">
      <canvas id="endCanvas" width="300" height="190"></canvas>
      <div id="endTextBlock">
        <div class="final-msg" id="finalMsg"></div>
        <div class="score-line" id="scoreLine"></div>
        <button class="btn" id="againBtn">یه بار دیگه بازی کن</button>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  const faMap = {'0':'۰','1':'۱','2':'۲','3':'۳','4':'۴','5':'۵','6':'۶','7':'۷','8':'۸','9':'۹'};
  function toFa(n){ return String(n).split('').map(d=>faMap[d]!==undefined?faMap[d]:d).join(''); }

  // ================= CHARACTER DRAWING =================

  function drawHero(ctx, t, state, scale){
    scale = scale || 1;
    ctx.save();
    ctx.scale(scale, scale);

    const sway = Math.sin(t*2) * 5;
    const bob = Math.sin(t*3) * 2;
    const blink = (Math.sin(t*1.7) > 0.985) ? 0.08 : 1;
    const happy = (state === 'happy');
    const startled = (state === 'startled');

    ctx.translate(0, bob);

    ctx.fillStyle = '#ff4d6d';
    ctx.beginPath();
    ctx.moveTo(-14, -8);
    ctx.quadraticCurveTo(-30 + sway, 20, -10 + sway*0.6, 40);
    ctx.quadraticCurveTo(-2, 24, 2, 8);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#e63757';
    ctx.beginPath();
    ctx.moveTo(14, -8);
    ctx.quadraticCurveTo(30 + sway, 20, 10 + sway*0.6, 40);
    ctx.quadraticCurveTo(2, 24, -2, 8);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#5b3aa0';
    if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(-16,32,11,12,3); ctx.fill(); ctx.beginPath(); ctx.roundRect(5,32,11,12,3); ctx.fill(); }
    else { ctx.fillRect(-16,32,11,12); ctx.fillRect(5,32,11,12); }
    ctx.fillStyle = '#8a6fd1';
    ctx.fillRect(-16,32,11,3);
    ctx.fillRect(5,32,11,3);

    ctx.fillStyle = '#e94f8a';
    ctx.beginPath();
    ctx.moveTo(-15,-4);
    ctx.quadraticCurveTo(-18,20,-13,34);
    ctx.lineTo(13,34);
    ctx.quadraticCurveTo(18,20,15,-4);
    ctx.quadraticCurveTo(0,-12,-15,-4);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#5b3aa0';
    ctx.fillRect(-16,20,32,4);

    ctx.save();
    ctx.translate(0,10);
    ctx.fillStyle = '#ffcf5c';
    drawStarShape(ctx, 6);
    ctx.fill();
    ctx.restore();

    const armSwing = Math.sin(t*2.4)*6;
    ctx.fillStyle = '#e94f8a';
    ctx.beginPath();
    ctx.ellipse(-19, 6+armSwing*0.3, 6, 12, -0.3, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(19, 6-armSwing*0.3, 6, 12, 0.3, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#f4c39a';
    ctx.beginPath(); ctx.arc(-21, 16+armSwing*0.3, 4.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(21, 16-armSwing*0.3, 4.5, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = '#4a2e1f';
    ctx.beginPath(); ctx.ellipse(-22+sway*0.3, -14, 8, 11, -0.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(22+sway*0.3, -14, 8, 11, 0.3, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = '#f4c39a';
    ctx.beginPath();
    ctx.ellipse(0, -18, 15, 15, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = '#4a2e1f';
    ctx.beginPath();
    ctx.moveTo(-15,-20);
    ctx.quadraticCurveTo(-16,-34,0,-33);
    ctx.quadraticCurveTo(16,-34,15,-20);
    ctx.quadraticCurveTo(8,-27,0,-26);
    ctx.quadraticCurveTo(-8,-27,-15,-20);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#ff4d6d';
    ctx.beginPath();
    ctx.moveTo(-13,-21);
    ctx.quadraticCurveTo(-13,-27,-3,-26);
    ctx.quadraticCurveTo(0,-24,3,-26);
    ctx.quadraticCurveTo(13,-27,13,-21);
    ctx.quadraticCurveTo(13,-15,3,-16);
    ctx.quadraticCurveTo(0,-14,-3,-16);
    ctx.quadraticCurveTo(-13,-15,-13,-21);
    ctx.closePath();
    ctx.fill();

    const eyeY = -21;
    if(happy){
      ctx.lineWidth = 2.4; ctx.strokeStyle = '#241010'; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-9,eyeY+2); ctx.quadraticCurveTo(-6,eyeY-3,-2,eyeY+2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(2,eyeY+2); ctx.quadraticCurveTo(6,eyeY-3,9,eyeY+2); ctx.stroke();
    } else {
      const eh = startled ? 6 : 5*blink;
      ctx.fillStyle = '#241010';
      ctx.beginPath(); ctx.ellipse(-5.5, eyeY, 2.8, Math.max(0.5,eh), 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(5.5, eyeY, 2.8, Math.max(0.5,eh), 0, 0, Math.PI*2); ctx.fill();
    }

    ctx.strokeStyle = '#a94a3d'; ctx.lineWidth = 1.6; ctx.lineCap='round';
    ctx.beginPath();
    if(startled){
      ctx.ellipse(0, -9, 2.4, 3.2, 0, 0, Math.PI*2); ctx.stroke();
    } else {
      ctx.moveTo(-5,-9);
      ctx.quadraticCurveTo(0, happy ? -3 : -6, 5,-9);
      ctx.stroke();
    }

    ctx.fillStyle = 'rgba(255,120,140,.35)';
    ctx.beginPath(); ctx.ellipse(-9,-12,2.6,1.8,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(9,-12,2.6,1.8,0,0,Math.PI*2); ctx.fill();

    ctx.restore();
  }

  function drawRescueCat(ctx, t, scale){
    scale = scale || 1;
    ctx.save();
    ctx.scale(scale, scale);
    const sway = Math.sin(t*4) * 3;

    ctx.strokeStyle = '#e58a4a'; ctx.lineWidth = 6; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(13,10);
    ctx.quadraticCurveTo(24+sway*0.5, 6+sway, 20+sway, -8);
    ctx.stroke();

    ctx.fillStyle = '#f5a95f';
    ctx.beginPath(); ctx.ellipse(0,10,15,12,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff3e0';
    ctx.beginPath(); ctx.ellipse(0,14,8,7,0,0,Math.PI*2); ctx.fill();

    ctx.fillStyle = '#f5a95f';
    ctx.beginPath(); ctx.moveTo(-13,-8); ctx.lineTo(-17,-20); ctx.lineTo(-5,-14); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(13,-8); ctx.lineTo(17,-20); ctx.lineTo(5,-14); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffc9d6';
    ctx.beginPath(); ctx.moveTo(-12,-9); ctx.lineTo(-14,-15); ctx.lineTo(-8,-12); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(12,-9); ctx.lineTo(14,-15); ctx.lineTo(8,-12); ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#f7b876';
    ctx.beginPath(); ctx.ellipse(0,-3,13,11,0,0,Math.PI*2); ctx.fill();

    ctx.fillStyle = '#2a1b12';
    ctx.beginPath(); ctx.ellipse(-4.5,-4,2.2,3,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(4.5,-4,2.2,3,0,0,Math.PI*2); ctx.fill();

    ctx.fillStyle = '#e0668a';
    ctx.beginPath(); ctx.moveTo(-1.5,2); ctx.lineTo(1.5,2); ctx.lineTo(0,4); ctx.closePath(); ctx.fill();

    ctx.restore();
  }

  function drawStarShape(ctx, r){
    ctx.beginPath();
    for(let i=0;i<10;i++){
      const rad = (i%2===0) ? r : r*0.45;
      const ang = -Math.PI/2 + i*Math.PI/5;
      const px = Math.cos(ang)*rad, py = Math.sin(ang)*rad;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
  }

  function drawMeteor(ctx, size, t){
    ctx.save();
    const grad = ctx.createLinearGradient(0,-size*3,0,0);
    grad.addColorStop(0,'rgba(255,140,80,0)');
    grad.addColorStop(1,'rgba(255,140,80,.55)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-size*0.3,0); ctx.lineTo(size*0.3,0); ctx.lineTo(0,-size*3);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#8a7b8f';
    ctx.beginPath();
    for(let i=0;i<8;i++){
      const ang = i*Math.PI/4;
      const rad = size*(0.8+0.2*Math.sin(i*2.3+t));
      const px = Math.cos(ang)*rad, py = Math.sin(ang)*rad;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(60,50,65,.5)';
    ctx.beginPath(); ctx.arc(-size*0.2,-size*0.15,size*0.22,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(size*0.25,size*0.2,size*0.16,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawBat(ctx, t, size){
    ctx.save();
    const flap = Math.sin(t*10);
    ctx.fillStyle = '#3a1f52';
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(-size*1.3, -size*0.5*flap - size*0.25, -size*1.7, size*0.25);
    ctx.quadraticCurveTo(-size*0.7, size*0.1, 0, 0);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(size*1.3, -size*0.5*flap - size*0.25, size*1.7, size*0.25);
    ctx.quadraticCurveTo(size*0.7, size*0.1, 0, 0);
    ctx.fill();
    ctx.beginPath(); ctx.ellipse(0,0,size*0.55,size*0.45,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ff5c7a';
    ctx.beginPath(); ctx.arc(-size*0.16,-size*0.05,size*0.09,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(size*0.16,-size*0.05,size*0.09,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawDarkOrb(ctx, size, t){
    ctx.save();
    const trail = ctx.createLinearGradient(0,-size*3,0,0);
    trail.addColorStop(0,'rgba(190,50,130,0)');
    trail.addColorStop(1,'rgba(190,50,130,.55)');
    ctx.fillStyle = trail;
    ctx.beginPath(); ctx.moveTo(-size*0.25,0); ctx.lineTo(size*0.25,0); ctx.lineTo(0,-size*3); ctx.closePath(); ctx.fill();

    const g = ctx.createRadialGradient(-size*0.25,-size*0.25,0,0,0,size);
    g.addColorStop(0,'#ffb3e0');
    g.addColorStop(0.55,'#c23a8f');
    g.addColorStop(1,'#4a1440');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,0,size,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function drawShot(ctx, size, t){
    ctx.save();
    const trail = ctx.createLinearGradient(0,size*2.5,0,0);
    trail.addColorStop(0,'rgba(91,230,208,0)');
    trail.addColorStop(1,'rgba(91,230,208,.7)');
    ctx.fillStyle = trail;
    ctx.beginPath(); ctx.moveTo(-size*0.25,0); ctx.lineTo(size*0.25,0); ctx.lineTo(0,size*2.5); ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#ffcf5c';
    drawStarShape(ctx, size);
    ctx.fill();
    ctx.restore();
  }

  function drawBoss(ctx, t, hitFlash){
    ctx.save();
    const hover = Math.sin(t*1.6)*4;
    ctx.translate(0,hover);

    ctx.strokeStyle = 'rgba(60,20,80,.8)'; ctx.lineWidth=6; ctx.lineCap='round';
    for(let i=-1;i<=1;i++){
      const wx = i*18;
      const wob = Math.sin(t*3+i)*6;
      ctx.beginPath();
      ctx.moveTo(wx,30);
      ctx.quadraticCurveTo(wx+wob,45,wx+wob*0.6,60);
      ctx.stroke();
    }

    ctx.fillStyle = '#241030';
    ctx.beginPath();
    for(let i=0;i<10;i++){
      const ang = i*Math.PI/5;
      const rad = 46*(0.85+0.15*Math.sin(i*1.7+t*0.5));
      const px=Math.cos(ang)*rad, py=Math.sin(ang)*rad*0.85 -6;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#5b2a70'; ctx.lineWidth=3; ctx.stroke();

    ctx.fillStyle='#1b0d24';
    ctx.beginPath(); ctx.moveTo(-30,-30); ctx.lineTo(-42,-58); ctx.lineTo(-18,-36); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(30,-30); ctx.lineTo(42,-58); ctx.lineTo(18,-36); ctx.closePath(); ctx.fill();

    ctx.strokeStyle='#000'; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-28,-16); ctx.lineTo(-10,-8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(28,-16); ctx.lineTo(10,-8); ctx.stroke();

    [[-16,-2],[16,-2]].forEach(function(p){
      const ex=p[0], ey=p[1];
      ctx.save(); ctx.translate(ex,ey);
      const g=ctx.createRadialGradient(0,0,0,0,0,10);
      g.addColorStop(0,'rgba(255,120,60,.9)'); g.addColorStop(1,'rgba(255,120,60,0)');
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#ff8a3d';
      ctx.beginPath(); ctx.ellipse(0,0,5,6,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#1b0d24';
      ctx.beginPath(); ctx.arc(0,1,2.2,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });

    ctx.fillStyle = '#0d0612';
    ctx.beginPath();
    ctx.moveTo(-16,14); ctx.lineTo(16,14); ctx.lineTo(12,26); ctx.lineTo(4,18);
    ctx.lineTo(0,26); ctx.lineTo(-4,18); ctx.lineTo(-12,26);
    ctx.closePath(); ctx.fill();

    if(hitFlash>0){
      ctx.globalAlpha = hitFlash*0.7;
      ctx.fillStyle='#fff';
      ctx.beginPath();
      for(let i=0;i<10;i++){
        const ang=i*Math.PI/5; const rad=46*(0.85+0.15*Math.sin(i*1.7+t*0.5));
        const px=Math.cos(ang)*rad, py=Math.sin(ang)*rad*0.85-6;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha=1;
    }
    ctx.restore();
  }

  function drawBigStarChar(ctx, t, scale){
    scale = scale || 1;
    ctx.save();
    ctx.scale(scale, scale);
    const bob = Math.sin(t*2.6) * 4;
    ctx.translate(0, bob);

    const glow = ctx.createRadialGradient(0,0,0,0,0,55);
    glow.addColorStop(0,'rgba(255,207,92,.55)');
    glow.addColorStop(1,'rgba(255,207,92,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0,0,55,0,Math.PI*2); ctx.fill();

    ctx.fillStyle = '#ffcf5c';
    drawStarShape(ctx, 32);
    ctx.fill();

    ctx.fillStyle = '#241242';
    ctx.beginPath(); ctx.arc(-8,-2,2.6,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8,-2,2.6,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#241242'; ctx.lineWidth = 2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-7,6); ctx.quadraticCurveTo(0,13,7,6); ctx.stroke();

    ctx.fillStyle = 'rgba(255,120,140,.4)';
    ctx.beginPath(); ctx.ellipse(-13,3,3,2,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(13,3,3,2,0,0,Math.PI*2); ctx.fill();

    ctx.restore();
  }

  function drawMonkeyChar(ctx, t, scale){
    scale = scale || 1;
    ctx.save();
    ctx.scale(scale, scale);
    const bob = Math.sin(t*2.6 + 1.2) * 4;

    ctx.stroke();

    const wave = Math.sin(t*5);

    ctx.translate(-16,4);
    ctx.rotate(-0.6 + wave*0.5);
    ctx.fillStyle = '#8b5a3c';
    ctx.beginPath(); ctx.ellipse(0,8,5,11,0,0,Math.PI*2); ctx.fill();
    ctx.restore();

    ctx.fillStyle = '#8b5a3c';
    ctx.beginPath(); ctx.ellipse(16,12,5,11,0.3,0,Math.PI*2); ctx.fill();

    ctx.fillStyle = '#a9754f';
    ctx.beginPath(); ctx.ellipse(0,14,15,14,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e8c9a0';
    ctx.beginPath(); ctx.ellipse(0,17,8,9,0,0,Math.PI*2); ctx.fill();

    ctx.fillStyle = '#a9754f';
    ctx.beginPath(); ctx.arc(-15,-6,7,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(15,-6,7,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e8c9a0';

    ctx.beginPath(); ctx.arc(15,-6,4,0,Math.PI*2); ctx.fill();

    ctx.fillStyle = '#a9754f';
    ctx.beginPath(); ctx.ellipse(0,-6,14,13,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e8c9a0';
    ctx.beginPath(); ctx.ellipse(0,-2,10,9,0,0,Math.PI*2); ctx.fill();

    ctx.fillStyle = '#241611';
    ctx.beginPath(); ctx.arc(-4.5,-6,2.2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4.5,-6,2.2,0,Math.PI*2); ctx.fill();

    ctx.strokeStyle = '#241611'; ctx.lineWidth = 1.6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-4,2); ctx.quadraticCurveTo(0,6,4,2); ctx.stroke();

  function triggerJump(){
    if(!playing) return;
    jumpVel = -380;
  }

  function fireShot(){
    if(!playing) return;
    if(elapsed - lastShotTime < SHOT_COOLDOWN) return;
    lastShotTime = elapsed;
    shots.push({ x: heroX, y: getHeroY()-28, vy: -560, size: 9 });

  shootBtn.addEventListener('pointerdown', (e)=>{ e.preventDefault(); e.stopPropagation(); fireShot(); });
  shootBtn.addEventListener('touchstart', (e)=>{ e.preventDefault(); e.stopPropagation(); fireShot(); }, {passive:false});

  function pointerHandler(e){
    if(!playing) return;
    const rect = canvas.getBoundingClientRect();
    const clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
    heroTargetX = clientX - rect.left;
    if(e.type === 'pointerdown' || e.type === 'touchstart'){ triggerJump(); }
    e.preventDefault();
  }
  canvas.addEventListener('pointerdown', pointerHandler);
  canvas.addEventListener('pointermove', pointerHandler);
  canvas.addEventListener('touchstart', pointerHandler, {passive:false});
  canvas.addEventListener('touchmove', pointerHandler, {passive:false});

  document.addEventListener('keydown', (e)=>{
    if(!playing) return;
    if(e.key === 'ArrowLeft') heroTargetX = Math.max(30, heroTargetX - 40);
    if(e.key === 'ArrowRight') heroTargetX = Math.min(W-30, heroTargetX + 40);
    if(e.key === ' ' || e.key === 'ArrowUp'){ triggerJump(); }
    if(e.key === 'f' || e.key === 'F'){ fireShot(); }
  });

  function makeItem(type, x, size, vy){
    return {
      type, x, y: -30, size, vy,
      rot: Math.random()*Math.PI*2,
      rotSpeed: (-2+Math.random()*4),
      wobble: Math.random()*Math.PI*2
    };
  }

  function spawnItem(){
    const x = 30 + Math.random()*(W-60);
    if(currentStage === 1){
      const roll = Math.random();
      const type = roll < 0.18 ? 'bat' : 'star';
      const speedBase = 110 + Math.min(90, elapsed*3.2);
      items.push(makeItem(type, x, type==='bat'?20:(13+Math.random()*6), speedBase+Math.random()*40));
    } else {
      const roll = Math.random();
      const type = roll < 0.28 ? 'meteor' : (roll < 0.52 ? 'cat' : 'star');
      const speedBase = 140 + Math.min(180, elapsed*4);
      items.push(makeItem(type, x, type==='meteor'?(16+Math.random()*8):(type==='cat'?16:(13+Math.random()*6)), speedBase+Math.random()*40));
    }
  }

  function spawnParticles(x,y,color,count){
    for(let i=0;i<count;i++){
      const a = Math.random()*Math.PI*2;
      const sp = 60 + Math.random()*120;
      particles.push({
        x,y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: 0.5+Math.random()*0.3, age:0, size: 2+Math.random()*3, color
      });
    }
  }

  let shakeT = 0;

      comboText.style.opacity = '0';
      comboText.style.transform = 'translateX(-50%) scale(1)';

  function updateBossBar(){

  function getHeroY(){ return H*heroY_ratio + heroYOffset; }

  function triggerBossDefeat(){

    bossDefeatTriggered = true;
    spawningActive = false;
    showStageBanner('قهرمان دنیا رو نجات دادش! رئیس بد شکست خورد! 🎉', ()=>{ endGame(); });

    heroDownTriggered = true;

    clearInterval(countdownId);
    showStageBanner('😿 قهرمانمون زمین خورد... بیا دوباره تلاش کنیم!', ()=>{ beginRun(); });

  function loseLife(){
    lives = Math.max(0, lives-1);
    updateLivesUI();
    if(lives <= 0){ triggerHeroDown(); }
  }

  function update(dt){
    elapsed += dt;
    heroX += (heroTargetX - heroX) * Math.min(1, dt*8);
    heroX = Math.max(28, Math.min(W-28, heroX));

    heroYOffset += jumpVel*dt;
    jumpVel += 1100*dt;
    if(heroYOffset >= 0){ heroYOffset = 0; jumpVel = 0; }

    if(heroStateTimer > 0){ heroStateTimer -= dt; if(heroStateTimer<=0) heroState='idle'; }

    if(currentStage === 3){
      bossX = W/2 + Math.sin(elapsed*0.6) * Math.min(90, W*0.28);
      bossY = H*0.16;
      if(bossHitFlash > 0) bossHitFlash -= dt*2.2;

      if(spawningActive){
        spawnAcc += dt;
        const starInterval = Math.max(0.7, 1.25 - elapsed*0.01);
        if(spawnAcc >= starInterval){
          spawnAcc = 0;
          items.push(makeItem('star', 30+Math.random()*(W-60), 13+Math.random()*6, 130+Math.random()*40));
        }
        bossShootAcc += dt;
        const healthRatio = bossHealth/BOSS_MAX_HEALTH;
        const shootInterval = Math.max(0.55, 1.4 - (1-healthRatio)*0.85);
        if(bossShootAcc >= shootInterval){
          bossShootAcc = 0;
          items.push(makeItem('orb', bossX + (-24+Math.random()*48), 18+Math.random()*6, 170+Math.min(150,(1-healthRatio)*220)+Math.random()*40));
        }
      }
    } else if(spawningActive){
      const spawnInterval = currentStage===1
        ? Math.max(0.32, 0.5 - elapsed*0.012)
        : Math.max(0.22, 0.44 - elapsed*0.015);
      spawnAcc += dt;
      if(spawnAcc >= spawnInterval){ spawnAcc = 0; spawnItem(); }
    }

    // move shots, drop off-screen ones
    for(let i=shots.length-1;i>=0;i--){
      shots[i].y += shots[i].vy*dt;
      if(shots[i].y < -40) shots.splice(i,1);
    }

    // shots vs boss
    if(currentStage === 3 && !bossDefeatTriggered){
      for(let i=shots.length-1;i>=0;i--){
        const s = shots[i];
        const dx = s.x - bossX, dy = s.y - bossY;
        if(Math.abs(dx) < 44 && Math.abs(dy) < 44){
          shots.splice(i,1);
          bossHealth = Math.max(0, bossHealth-1);
          bossHitFlash = 1;
          updateBossBar();
          spawnParticles(bossX, bossY, '#ffcf5c', 8);
          if(bossHealth <= 0){ triggerBossDefeat(); break; }
        }
      }
    }

    // shots vs bad items (bat / meteor / orb)
    for(let i=shots.length-1;i>=0;i--){
      const s = shots[i];
      let hitIndex = -1;
      for(let j=items.length-1;j>=0;j--){
        const it = items[j];
        if(it.type!=='bat' && it.type!=='meteor' && it.type!=='orb') continue;
        const dx = it.x - s.x, dy = it.y - s.y;
        if(Math.abs(dx) < it.size+8 && Math.abs(dy) < it.size+8){ hitIndex = j; break; }
      }
      if(hitIndex >= 0){
        const it = items[hitIndex];
        spawnParticles(it.x, it.y, '#5be6d0', 8);
        items.splice(hitIndex,1);
        shots.splice(i,1);
        score += 1;
        scoreBox.textContent = 'امتیاز: ' + toFa(score);
      }
    }

    const heroY = getHeroY();
    for(let i=items.length-1;i>=0;i--){
      const it = items[i];
      it.y += it.vy*dt;
      it.rot += it.rotSpeed*dt;
      it.wobble += dt*3;
      it.x += Math.sin(it.wobble)*0.4;

      const dx = it.x - heroX, dy = it.y - heroY;
      const hitDist = (it.type==='meteor'||it.type==='orb') ? 34 : (it.type==='cat' ? 36 : (it.type==='bat' ? 30 : 30));
      if(Math.abs(dy) < hitDist*0.65 && Math.abs(dx) < hitDist){
        if(it.type === 'star'){
          score += 1; combo += 1; starsCaught += 1;
          scoreBox.textContent = 'امتیاز: ' + toFa(score);
          spawnParticles(it.x, it.y, '#ffcf5c', 10);
          heroState='happy'; heroStateTimer=0.4;
          showCombo(combo);
        } else if(it.type === 'cat'){
          score += 2; combo += 1; catsSaved += 1;
          scoreBox.textContent = 'امتیاز: ' + toFa(score);
          spawnParticles(it.x, it.y, '#ff8fab', 12);
          heroState='happy'; heroStateTimer=0.4;
          showCombo(combo);
        } else if(it.type === 'bat'){
          score = Math.max(0, score-1); combo = 0;
          scoreBox.textContent = 'امتیاز: ' + toFa(score);
          spawnParticles(it.x, it.y, '#b98fe0', 8);
          heroState='startled'; heroStateTimer=0.5;
          triggerShake();
          loseLife();
        } else {
          score = Math.max(0, score-2); combo = 0;
          scoreBox.textContent = 'امتیاز: ' + toFa(score);
          spawnParticles(it.x, it.y, it.type==='orb' ? '#e06fc0' : '#c9c2cc', 8);
          heroState='startled'; heroStateTimer=0.5;
          triggerShake();
          loseLife();
        }
        items.splice(i,1);
        continue;
      }
      if(it.y > H+60) items.splice(i,1);
    }

    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.age += dt;
      if(p.age >= p.life){ particles.splice(i,1); continue; }
      p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 200*dt;
    }

    if(shakeT>0) shakeT -= dt;
  }

  function render(t){
    ctx.clearRect(0,0,W,H);
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#140b2e'); g.addColorStop(1,'#2a1657');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    bgStars.forEach(s=>{
      const tw = 0.5 + 0.5*Math.sin(t*s.speed + s.phase);
      ctx.globalAlpha = 0.3 + tw*0.7;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    if(currentStage === 3 && playing){
      ctx.save();
      ctx.translate(bossX, bossY);
      drawBoss(ctx, t, bossHitFlash);
      ctx.restore();
    }

    items.forEach(it=>{
      ctx.save();
      ctx.translate(it.x, it.y);
      if(it.type==='star'){
        ctx.rotate(it.rot);
        const glow = ctx.createRadialGradient(0,0,0,0,0,it.size*2.2);
        glow.addColorStop(0,'rgba(255,207,92,.55)');
        glow.addColorStop(1,'rgba(255,207,92,0)');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(0,0,it.size*2.2,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ffcf5c';
        drawStarShape(ctx, it.size);
        ctx.fill();
      } else if(it.type==='cat'){
        const glow = ctx.createRadialGradient(0,0,0,0,0,it.size*1.8);
        glow.addColorStop(0,'rgba(255,143,171,.35)');
        glow.addColorStop(1,'rgba(255,143,171,0)');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(0,0,it.size*1.8,0,Math.PI*2); ctx.fill();
        drawRescueCat(ctx, t, 1);
      } else if(it.type==='bat'){
        drawBat(ctx, t, it.size);
      } else if(it.type==='orb'){
        drawDarkOrb(ctx, it.size, t);
      } else {
        drawMeteor(ctx, it.size, t);
      }
      ctx.restore();
    });

    shots.forEach(s=>{
      ctx.save();
      ctx.translate(s.x, s.y);
      drawShot(ctx, s.size, t);
      ctx.restore();
    });

    particles.forEach(p=>{
      const alpha = 1 - p.age/p.life;
      ctx.globalAlpha = Math.max(0,alpha);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    const heroY = getHeroY();
    let sx=0, sy=0;
    if(shakeT>0){ sx=(Math.random()-0.5)*8; sy=(Math.random()-0.5)*8; }
    ctx.save();
    ctx.translate(heroX+sx, heroY+sy);
    drawHero(ctx, t, heroState, 1.1);
    ctx.restore();
  }

  let rafId = null;
  function loop(ts){
    if(!playing) return;
    if(!lastTs) lastTs = ts;
    const dt = Math.min(0.05, (ts-lastTs)/1000);
    lastTs = ts;
    update(dt);
    render(ts/1000);
    rafId = requestAnimationFrame(loop);
  }

  function showStageBanner(text, cb){
    spawningActive = false;
    stageBannerText.textContent = text;
    stageBanner.classList.add('show');
    setTimeout(()=>{
      stageBanner.classList.remove('show');
      setTimeout(cb, 350);
    }, 1500);
  }

  let countdownId = null;
  function beginStage(n){
    currentStage = n;
    elapsed = 0; spawnAcc = 0; bossShootAcc = 0; lastShotTime = -99;
    stageLabel.textContent = n===1 ? 'ماموریت ۱' : (n===2 ? 'ماموریت ۲' : 'ماموریت ۳: رئیس بد');

    clearInterval(countdownId);

    if(n === 3){
      bossHealth = BOSS_MAX_HEALTH;
      bossDefeatTriggered = false;
      bossX = W/2; bossY = H*0.16; bossHitFlash = 0;
      bossBarWrap.style.display = 'block';
      updateBossBar();
      timerEl.style.display = 'none';
      spawningActive = true;
      return; // no countdown — this stage only ends when the boss is defeated
    }

    timerEl.style.display = '';
    bossBarWrap.style.display = 'none';
    timeLeft = n===1 ? STAGE1_TIME : STAGE2_TIME;
    timerEl.textContent = toFa(timeLeft);
    spawningActive = true;

    countdownId = setInterval(()=>{
      timeLeft -= 1;
      timerEl.textContent = toFa(Math.max(0,timeLeft));
      if(timeLeft <= 0){
        clearInterval(countdownId);
        if(currentStage === 1){
          items = [];
          showStageBanner('ماموریت ۲: گربه‌ها رو نجات بده و از شهاب دوری کن! 🐱', ()=>{ beginStage(2); });
        } else if(currentStage === 2){
          items = [];
          showStageBanner('ماموریت ۳: با رئیس بد مبارزه کن! باهاش شلیک کن 👹⚡', ()=>{ beginStage(3); });
        }
      }
    },1000);
  }

  function beginRun(){
    resetGame();
    gameWrap.classList.remove('hidden');
    endScreen.classList.add('hidden');
    playing = true; lastTs = 0;
    if(rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
    showStageBanner('ماموریت ۱: ستاره‌ها رو جمع کن! ⭐', ()=>{ beginStage(1); });
  }

  function startGame(){
    friendName = nameInput.value.trim();
    previewRunning = false;
    nameScreen.classList.add('hidden');
    beginRun();
  }

  // ================= END SCREEN (hug + message) =================
  const endCanvas = document.getElementById('endCanvas');
  const ectx = endCanvas.getContext('2d');
  let endRunning = false;
  let hugStartTs = null;
  let sparkleFired = false;

  function endLoop(ts){
    if(!endRunning) return;
    if(hugStartTs === null) hugStartTs = ts;
    const hugT = Math.min(1, (ts - hugStartTs)/1500);
    const ease = 1 - Math.pow(1-hugT, 3);

    ectx.clearRect(0,0,300,190);

    const heroX0 = 150, heroY0 = 140;
    const starStart = [50,55], starEnd = [112,108];
    const monkeyStart = [255,55], monkeyEnd = [190,118];

    const sx = starStart[0] + (starEnd[0]-starStart[0])*ease;
    const sy = starStart[1] + (starEnd[1]-starStart[1])*ease;
    const mx = monkeyStart[0] + (monkeyEnd[0]-monkeyStart[0])*ease;
    const my = monkeyStart[1] + (monkeyEnd[1]-monkeyStart[1])*ease;

    ectx.save(); ectx.translate(heroX0, heroY0); drawHero(ectx, ts/1000, 'happy', 1.05); ectx.restore();
    ectx.save(); ectx.translate(sx, sy); drawBigStarChar(ectx, ts/1000, 0.72); ectx.restore();
    ectx.save(); ectx.translate(mx, my); drawMonkeyChar(ectx, ts/1000, 0.9); ectx.restore();

    if(ease >= 0.97 && !sparkleFired){
      sparkleFired = true;
      spawnEndSparkles(heroX0, heroY0-20);
    }
    drawEndSparkles();

    requestAnimationFrame(endLoop);
  }

  let endSparkles = [];
  function spawnEndSparkles(x,y){
    for(let i=0;i<16;i++){
      const a = Math.random()*Math.PI*2;
      const sp = 40+Math.random()*70;
      endSparkles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.7,age:0,size:2+Math.random()*2.5});
    }
  }
  function drawEndSparkles(){
    for(let i=endSparkles.length-1;i>=0;i--){
      const p = endSparkles[i];
      p.age += 0.016; p.x+=p.vx*0.016; p.y+=p.vy*0.016; p.vy+=120*0.016;
      if(p.age>=p.life){ endSparkles.splice(i,1); continue; }
      ectx.globalAlpha = Math.max(0,1-p.age/p.life);
      ectx.fillStyle = '#ffcf5c';
      ectx.beginPath(); ectx.arc(p.x,p.y,p.size,0,Math.PI*2); ectx.fill();
      ectx.globalAlpha = 1;
    }
  }

  const GIFT_MESSAGE = "سلاممم قهرمان شگفت انگیز واقعا کارت عالی بودش افتخار می کنم که همچین دوست شجاعی دارم. تولد مبارک بهترین دوست دنیا واقعا از تک تک لحظاتی که کنارم هستی و خوشحالم می کنی واقعا ازت ممنونم. امیدوارم همیشه اینو بدونی که یکی هست که همیشه حواسش به‌ تو هست و از صمیم قلبش دوست داره.\nبازممم تولد مبارککک نینیی کوچولووو";

  function endGame(){
    playing = false;
    clearInterval(countdownId);
    if(rafId) cancelAnimationFrame(rafId);
    bossBarWrap.style.display = 'none';
    gameWrap.classList.add('hidden');
    endScreen.classList.remove('hidden');

    finalMsg.textContent = GIFT_MESSAGE;
    scoreLine.textContent = `${toFa(starsCaught)} ستاره جمع کردی و ${toFa(catsSaved)} گربه نجات دادی ✨🐱`;
    endTextBlock.classList.remove('reveal');

    hugStartTs = null; sparkleFired = false; endSparkles = [];
    endRunning = true;
    requestAnimationFrame(endLoop);
    launchConfetti();

    setTimeout(()=>{ endTextBlock.classList.add('reveal'); }, 1850);
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('againBtn').addEventListener('click', ()=>{
    endRunning = false;
    endScreen.classList.add('hidden');
    beginRun();
  });
  nameInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') startGame(); });

  function launchConfetti(){
    const c = document.getElementById('confettiCanvas');
    c.width = c.clientWidth; c.height = c.clientHeight;
    const cctx = c.getContext('2d');
    const colors = ['#ffcf5c','#ff4d6d','#5be6d0','#fdf3e3'];
    const pieces = Array.from({length:90},()=>({
      x: Math.random()*c.width, y: -20-Math.random()*c.height,
      w: 6+Math.random()*6, h: 8+Math.random()*10,
      color: colors[Math.floor(Math.random()*colors.length)],
      speed: 2+Math.random()*3, drift: -1+Math.random()*2,
      rot: Math.random()*360, rotSpeed: -6+Math.random()*12
    }));
    let frame=0;
    function draw(){
      if(frame++ > 300 || !endRunning){ cctx.clearRect(0,0,c.width,c.height); return; }
      cctx.clearRect(0,0,c.width,c.height);
      pieces.forEach(p=>{
        p.y+=p.speed; p.x+=p.drift; p.rot+=p.rotSpeed;
        if(p.y>c.height+20){ p.y=-20; p.x=Math.random()*c.width; }
        cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.rot*Math.PI/180);
        cctx.fillStyle=p.color; cctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cctx.restore();
      });
      requestAnimationFrame(draw);
    }
    draw();
  }

  resize();
  setTimeout(resize, 250);
  setTimeout(resize, 800);
})();
</script>
</body>
</html>
