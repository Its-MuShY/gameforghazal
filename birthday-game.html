<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>ماموریت قهرمان ستاره‌ها 🌟</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap');

  :root{
    --bg1:#140b2e;
    --bg2:#2a1657;
    --gold:#ffcf5c;
    --pink:#ff4d6d;
    --mint:#5be6d0;
    --cream:#fdf3e3;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%;
    font-family:'Vazirmatn',sans-serif;
    background:var(--bg1);
    color:var(--cream);
    overflow:hidden;
    user-select:none;
  }
  #app{ position:relative; width:100%; height:100vh; height:100dvh; overflow:hidden; }
  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center; z-index:10;
  }
  .hidden{ display:none !important; }

  h1{
    font-size:clamp(26px,8vw,40px);
    font-weight:900; margin:0 0 10px; color:var(--gold);
    text-shadow:0 2px 0 rgba(0,0,0,.3);
  }
  p.sub{
    font-size:clamp(14px,4vw,17px);
    opacity:.9; max-width:320px; line-height:2; margin:0 0 22px;
  }
  input#nameInput{
    font-family:inherit; font-size:18px; text-align:center;
    border:none; border-radius:999px; padding:13px 20px;
    width:min(260px,78vw); margin-bottom:16px;
    background:rgba(255,255,255,.12); color:var(--cream); outline:2px solid transparent;
  }
  input#nameInput:focus{ outline-color:var(--gold); background:rgba(255,255,255,.18); }
  input#nameInput::placeholder{ color:rgba(253,243,227,.5); }

  button.btn{
    font-family:inherit; font-weight:700; font-size:18px; color:#241242;
    background:linear-gradient(180deg,var(--gold),#e0a530);
    border:none; border-radius:999px; padding:15px 38px; cursor:pointer;
    box-shadow:0 6px 0 #b47b16, 0 10px 20px rgba(0,0,0,.35);
    transition:transform .1s ease;
  }
  button.btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #b47b16,0 4px 10px rgba(0,0,0,.3); }
  button.btn:focus-visible{ outline:3px solid var(--mint); outline-offset:3px; }

  canvas#previewCanvas, canvas#endCanvas{ margin-bottom:8px; }

  canvas#gameCanvas{
    position:absolute; inset:0; z-index:2; display:block; touch-action:none;
  }

  #hud{
    position:absolute; top:0; left:0; right:0; z-index:6;
    display:flex; align-items:flex-start; justify-content:space-between;
    padding:14px 18px; pointer-events:none;
  }
  #timer, #scoreBox{
    font-weight:700; font-size:15px; background:rgba(0,0,0,.3);
    padding:7px 14px; border-radius:999px;
  }
  #comboText{
    position:absolute; top:70px; left:50%; transform:translateX(-50%);
    font-weight:900; font-size:26px; color:var(--pink); text-shadow:0 2px 6px rgba(0,0,0,.4);
    z-index:6; opacity:0; pointer-events:none;
  }

  .final-msg{
    font-size:clamp(20px,6vw,28px); font-weight:900; color:var(--mint);
    margin:6px 0 4px; text-shadow:0 2px 0 rgba(0,0,0,.25); max-width:320px; line-height:1.6;
  }
  .score-line{ font-size:15px; opacity:.9; margin-bottom:22px; }

  #vignette{
    position:absolute; inset:0; pointer-events:none; z-index:5;
    background:radial-gradient(circle, transparent 60%, rgba(200,40,40,0) 100%);
    transition:background .15s ease;
  }

  .icon-row{ font-size:13px; opacity:.85; }
</style>
</head>
<body>
<div id="app">

  <!-- INTRO MESSAGE -->
  <div id="intro" class="screen">
    <h1>سلام قهرمان! 🌟</h1>
    <p class="sub">تو امروز انتخاب شدی تا دنیا رو نجات بدی.<br>گربه‌ها تو خطرن و آسمون پر از ستاره‌های گمشده‌ست... آماده‌ای؟</p>
    <button class="btn" id="introBtn">بعدی</button>
  </div>

  <!-- NAME ENTRY -->
  <div id="nameScreen" class="screen hidden">
    <canvas id="previewCanvas" width="160" height="170"></canvas>
    <h1 style="font-size:clamp(20px,6vw,28px)">اسم قهرمان داستان چیه؟</h1>
    <input id="nameInput" type="text" placeholder="اسمت رو بنویس" maxlength="20">
    <button class="btn" id="startBtn">شروع ماموریت 🚀</button>
  </div>

  <!-- GAME -->
  <div id="gameWrap" class="hidden" style="position:absolute; inset:0;">
    <canvas id="gameCanvas"></canvas>
    <div id="vignette"></div>
    <div id="hud">
      <div id="timer">۳۰</div>
      <div id="scoreBox">امتیاز: ۰</div>
    </div>
    <div id="comboText"></div>
  </div>

  <!-- END -->
  <div id="end" class="screen hidden">
    <canvas id="confettiCanvas" style="position:absolute; inset:0; z-index:1; pointer-events:none;"></canvas>
    <div style="position:relative; z-index:2; display:flex; flex-direction:column; align-items:center;">
      <canvas id="endCanvas" width="260" height="150"></canvas>
      <div class="final-msg" id="finalMsg"></div>
      <div class="score-line" id="scoreLine"></div>
      <button class="btn" id="againBtn">یه بار دیگه بازی کن</button>
    </div>
  </div>

</div>

<script>
(function(){
  "use strict";

  const faMap = {'0':'۰','1':'۱','2':'۲','3':'۳','4':'۴','5':'۵','6':'۶','7':'۷','8':'۸','9':'۹'};
  function toFa(n){ return String(n).split('').map(d=>faMap[d]!==undefined?faMap[d]:d).join(''); }

  // ================= CHARACTER DRAWING =================

  // ---- Hero girl (player character) ----
  function drawHero(ctx, t, state, scale){
    scale = scale || 1;
    ctx.save();
    ctx.scale(scale, scale);

    const sway = Math.sin(t*2) * 5;
    const bob = Math.sin(t*3) * 2;
    const blink = (Math.sin(t*1.7) > 0.985) ? 0.08 : 1;
    const happy = (state === 'happy');
    const startled = (state === 'startled');

    ctx.translate(0, bob);

    // cape (behind everything)
    ctx.fillStyle = '#ff4d6d';
    ctx.beginPath();
    ctx.moveTo(-14, -8);
    ctx.quadraticCurveTo(-30 + sway, 20, -10 + sway*0.6, 40);
    ctx.quadraticCurveTo(-2, 24, 2, 8);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#e63757';
    ctx.beginPath();
    ctx.moveTo(14, -8);
    ctx.quadraticCurveTo(30 + sway, 20, 10 + sway*0.6, 40);
    ctx.quadraticCurveTo(2, 24, -2, 8);
    ctx.closePath();
    ctx.fill();

    // boots
    ctx.fillStyle = '#5b3aa0';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-16,32,11,12,3) : ctx.rect(-16,32,11,12); ctx.fill();
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(5,32,11,12,3) : ctx.rect(5,32,11,12); ctx.fill();
    ctx.fillStyle = '#8a6fd1';
    ctx.fillRect(-16,32,11,3);
    ctx.fillRect(5,32,11,3);

    // torso / suit
    ctx.fillStyle = '#e94f8a';
    ctx.beginPath();
    ctx.moveTo(-15,-4);
    ctx.quadraticCurveTo(-18,20,-13,34);
    ctx.lineTo(13,34);
    ctx.quadraticCurveTo(18,20,15,-4);
    ctx.quadraticCurveTo(0,-12,-15,-4);
    ctx.closePath();
    ctx.fill();

    // belt
    ctx.fillStyle = '#5b3aa0';
    ctx.fillRect(-16,20,32,4);

    // chest emblem (small star)
    ctx.save();
    ctx.translate(0,10);
    ctx.fillStyle = '#ffcf5c';
    drawStarShape(ctx, 6);
    ctx.fill();
    ctx.restore();

    // arms
    const armSwing = Math.sin(t*2.4)*6;
    ctx.fillStyle = '#e94f8a';
    ctx.beginPath();
    ctx.ellipse(-19, 6+armSwing*0.3, 6, 12, -0.3, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(19, 6-armSwing*0.3, 6, 12, 0.3, 0, Math.PI*2);
    ctx.fill();
    // hands
    ctx.fillStyle = '#f4c39a';
    ctx.beginPath(); ctx.arc(-21, 16+armSwing*0.3, 4.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(21, 16-armSwing*0.3, 4.5, 0, Math.PI*2); ctx.fill();

    // hair back puffs
    ctx.fillStyle = '#4a2e1f';
    ctx.beginPath(); ctx.ellipse(-22+sway*0.3, -14, 8, 11, -0.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(22+sway*0.3, -14, 8, 11, 0.3, 0, Math.PI*2); ctx.fill();

    // head
    ctx.fillStyle = '#f4c39a';
    ctx.beginPath();
    ctx.ellipse(0, -18, 15, 15, 0, 0, Math.PI*2);
    ctx.fill();

    // hair top
    ctx.fillStyle = '#4a2e1f';
    ctx.beginPath();
    ctx.moveTo(-15,-20);
    ctx.quadraticCurveTo(-16,-34,0,-33);
    ctx.quadraticCurveTo(16,-34,15,-20);
    ctx.quadraticCurveTo(8,-27,0,-26);
    ctx.quadraticCurveTo(-8,-27,-15,-20);
    ctx.closePath();
    ctx.fill();

    // mask
    ctx.fillStyle = '#ff4d6d';
    ctx.beginPath();
    ctx.moveTo(-13,-21);
    ctx.quadraticCurveTo(-13,-27,-3,-26);
    ctx.quadraticCurveTo(0,-24,3,-26);
    ctx.quadraticCurveTo(13,-27,13,-21);
    ctx.quadraticCurveTo(13,-15,3,-16);
    ctx.quadraticCurveTo(0,-14,-3,-16);
    ctx.quadraticCurveTo(-13,-15,-13,-21);
    ctx.closePath();
    ctx.fill();

    // eyes
    const eyeY = -21;
    if(happy){
      ctx.lineWidth = 2.4; ctx.strokeStyle = '#241010'; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-9,eyeY+2); ctx.quadraticCurveTo(-6,eyeY-3,-2,eyeY+2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(2,eyeY+2); ctx.quadraticCurveTo(6,eyeY-3,9,eyeY+2); ctx.stroke();
    } else {
      const eh = startled ? 6 : 5*blink;
      ctx.fillStyle = '#241010';
      ctx.beginPath(); ctx.ellipse(-5.5, eyeY, 2.8, Math.max(0.5,eh), 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(5.5, eyeY, 2.8, Math.max(0.5,eh), 0, 0, Math.PI*2); ctx.fill();
    }

    // mouth
    ctx.strokeStyle = '#a94a3d'; ctx.lineWidth = 1.6; ctx.lineCap='round';
    ctx.beginPath();
    if(startled){
      ctx.ellipse(0, -9, 2.4, 3.2, 0, 0, Math.PI*2); ctx.stroke();
    } else {
      ctx.moveTo(-5,-9);
      ctx.quadraticCurveTo(0, happy ? -3 : -6, 5,-9);
      ctx.stroke();
    }

    // cheeks
    ctx.fillStyle = 'rgba(255,120,140,.35)';
    ctx.beginPath(); ctx.ellipse(-9,-12,2.6,1.8,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(9,-12,2.6,1.8,0,0,Math.PI*2); ctx.fill();

    ctx.restore();
  }

  // ---- Rescue cat (falling collectible) ----
  function drawRescueCat(ctx, t, scale){
    scale = scale || 1;
    ctx.save();
    ctx.scale(scale, scale);
    const sway = Math.sin(t*4) * 3;

    // tail
    ctx.strokeStyle = '#e58a4a'; ctx.lineWidth = 6; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(13,10);
    ctx.quadraticCurveTo(24+sway*0.5, 6+sway, 20+sway, -8);
    ctx.stroke();

    // body
    ctx.fillStyle = '#f5a95f';
    ctx.beginPath(); ctx.ellipse(0,10,15,12,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff3e0';
    ctx.beginPath(); ctx.ellipse(0,14,8,7,0,0,Math.PI*2); ctx.fill();

    // ears
    ctx.fillStyle = '#f5a95f';
    ctx.beginPath(); ctx.moveTo(-13,-8); ctx.lineTo(-17,-20); ctx.lineTo(-5,-14); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(13,-8); ctx.lineTo(17,-20); ctx.lineTo(5,-14); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffc9d6';
    ctx.beginPath(); ctx.moveTo(-12,-9); ctx.lineTo(-14,-15); ctx.lineTo(-8,-12); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(12,-9); ctx.lineTo(14,-15); ctx.lineTo(8,-12); ctx.closePath(); ctx.fill();

    // head
    ctx.fillStyle = '#f7b876';
    ctx.beginPath(); ctx.ellipse(0,-3,13,11,0,0,Math.PI*2); ctx.fill();

    // eyes
    ctx.fillStyle = '#2a1b12';
    ctx.beginPath(); ctx.ellipse(-4.5,-4,2.2,3,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(4.5,-4,2.2,3,0,0,Math.PI*2); ctx.fill();

    // nose + mouth
    ctx.fillStyle = '#e0668a';
    ctx.beginPath(); ctx.moveTo(-1.5,2); ctx.lineTo(1.5,2); ctx.lineTo(0,4); ctx.closePath(); ctx.fill();

    ctx.restore();
  }

  function drawStarShape(ctx, r){
    ctx.beginPath();
    for(let i=0;i<10;i++){
      const rad = (i%2===0) ? r : r*0.45;
      const ang = -Math.PI/2 + i*Math.PI/5;
      const px = Math.cos(ang)*rad, py = Math.sin(ang)*rad;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
  }

  function drawMeteor(ctx, size, t){
    ctx.save();
    const grad = ctx.createLinearGradient(0,-size*3,0,0);
    grad.addColorStop(0,'rgba(255,140,80,0)');
    grad.addColorStop(1,'rgba(255,140,80,.55)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(-size*0.3,0); ctx.lineTo(size*0.3,0); ctx.lineTo(0,-size*3);
    ctx.closePath(); ctx.fill();

    ctx.fillStyle = '#8a7b8f';
    ctx.beginPath();
    for(let i=0;i<8;i++){
      const ang = i*Math.PI/4;
      const rad = size*(0.8+0.2*Math.sin(i*2.3+t));
      const px = Math.cos(ang)*rad, py = Math.sin(ang)*rad;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(60,50,65,.5)';
    ctx.beginPath(); ctx.arc(-size*0.2,-size*0.15,size*0.22,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(size*0.25,size*0.2,size*0.16,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // ---- Big star character (end screen) ----
  function drawBigStarChar(ctx, t, scale){
    scale = scale || 1;
    ctx.save();
    ctx.scale(scale, scale);
    const bob = Math.sin(t*2.6) * 4;
    ctx.translate(0, bob);

    const glow = ctx.createRadialGradient(0,0,0,0,0,55);
    glow.addColorStop(0,'rgba(255,207,92,.55)');
    glow.addColorStop(1,'rgba(255,207,92,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(0,0,55,0,Math.PI*2); ctx.fill();

    ctx.fillStyle = '#ffcf5c';
    drawStarShape(ctx, 32);
    ctx.fill();

    // face
    ctx.fillStyle = '#241242';
    ctx.beginPath(); ctx.arc(-8,-2,2.6,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(8,-2,2.6,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#241242'; ctx.lineWidth = 2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-7,6); ctx.quadraticCurveTo(0,13,7,6); ctx.stroke();

    ctx.fillStyle = 'rgba(255,120,140,.4)';
    ctx.beginPath(); ctx.ellipse(-13,3,3,2,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(13,3,3,2,0,0,Math.PI*2); ctx.fill();

    ctx.restore();
  }

  // ---- Monkey character (end screen) ----
  function drawMonkeyChar(ctx, t, scale){
    scale = scale || 1;
    ctx.save();
    ctx.scale(scale, scale);
    const bob = Math.sin(t*2.6 + 1.2) * 4;
    ctx.translate(0, bob);

    // tail
    ctx.strokeStyle = '#8b5a3c'; ctx.lineWidth = 6; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(14,20);
    ctx.quadraticCurveTo(30, 18, 26, 0);
    ctx.stroke();

    // waving arm
    const wave = Math.sin(t*5);
    ctx.save();
    ctx.translate(-16,4);
    ctx.rotate(-0.6 + wave*0.5);
    ctx.fillStyle = '#8b5a3c';
    ctx.beginPath(); ctx.ellipse(0,8,5,11,0,0,Math.PI*2); ctx.fill();
    ctx.restore();

    // other arm
    ctx.fillStyle = '#8b5a3c';
    ctx.beginPath(); ctx.ellipse(16,12,5,11,0.3,0,Math.PI*2); ctx.fill();

    // body
    ctx.fillStyle = '#a9754f';
    ctx.beginPath(); ctx.ellipse(0,14,15,14,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e8c9a0';
    ctx.beginPath(); ctx.ellipse(0,17,8,9,0,0,Math.PI*2); ctx.fill();

    // ears
    ctx.fillStyle = '#a9754f';
    ctx.beginPath(); ctx.arc(-15,-6,7,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(15,-6,7,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e8c9a0';
    ctx.beginPath(); ctx.arc(-15,-6,4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(15,-6,4,0,Math.PI*2); ctx.fill();

    // head
    ctx.fillStyle = '#a9754f';
    ctx.beginPath(); ctx.ellipse(0,-6,14,13,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e8c9a0';
    ctx.beginPath(); ctx.ellipse(0,-2,10,9,0,0,Math.PI*2); ctx.fill();

    // eyes
    ctx.fillStyle = '#241611';
    ctx.beginPath(); ctx.arc(-4.5,-6,2.2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4.5,-6,2.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-3.8,-6.7,0.7,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(5.2,-6.7,0.7,0,Math.PI*2); ctx.fill();

    // nose/mouth
    ctx.strokeStyle = '#241611'; ctx.lineWidth = 1.6; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-4,2); ctx.quadraticCurveTo(0,6,4,2); ctx.stroke();

    ctx.restore();
  }

  // ================= PREVIEW CANVAS =================
  const previewCanvas = document.getElementById('previewCanvas');
  const pctx = previewCanvas.getContext('2d');
  let previewRunning = true;
  function previewLoop(ts){
    if(!previewRunning) return;
    pctx.clearRect(0,0,160,170);
    pctx.save();
    pctx.translate(80,95);
    drawHero(pctx, ts/1000, 'idle', 1.6);
    pctx.restore();
    requestAnimationFrame(previewLoop);
  }
  requestAnimationFrame(previewLoop);

  // ================= SCREENS / FLOW =================
  const introScreen = document.getElementById('intro');
  const nameScreen = document.getElementById('nameScreen');
  const gameWrap = document.getElementById('gameWrap');
  const endScreen = document.getElementById('end');
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const timerEl = document.getElementById('timer');
  const scoreBox = document.getElementById('scoreBox');
  const comboText = document.getElementById('comboText');
  const vignette = document.getElementById('vignette');
  const nameInput = document.getElementById('nameInput');
  const finalMsg = document.getElementById('finalMsg');
  const scoreLine = document.getElementById('scoreLine');

  document.getElementById('introBtn').addEventListener('click', ()=>{
    introScreen.classList.add('hidden');
    nameScreen.classList.remove('hidden');
    nameInput.focus();
  });

  const GAME_TIME = 32;

  let W=0, H=0;
  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
  }
  window.addEventListener('resize', resize);

  let bgStars = [];
  function buildBgStars(){
    bgStars = Array.from({length:55}, ()=>({
      x: Math.random()*W, y: Math.random()*H,
      r: 0.6 + Math.random()*1.6,
      phase: Math.random()*Math.PI*2,
      speed: 0.5 + Math.random()*1.2
    }));
  }

  let heroX = 0, heroTargetX = 0;
  const heroY_ratio = 0.82;
  let heroState = 'idle', heroStateTimer = 0;
  let score = 0, combo = 0, timeLeft = GAME_TIME;
  let starsCaught = 0, catsSaved = 0;
  let items = [];
  let particles = [];
  let playing = false;
  let elapsed = 0;
  let spawnAcc = 0;
  let lastTs = 0;
  let friendName = '';

  function resetGame(){
    resize();
    buildBgStars();
    heroX = heroTargetX = W/2;
    heroState = 'idle'; heroStateTimer = 0;
    score = 0; combo = 0; timeLeft = GAME_TIME;
    starsCaught = 0; catsSaved = 0;
    items = []; particles = [];
    elapsed = 0; spawnAcc = 0;
    scoreBox.textContent = 'امتیاز: ۰';
    timerEl.textContent = toFa(GAME_TIME);
  }

  function pointerHandler(e){
    if(!playing) return;
    const rect = canvas.getBoundingClientRect();
    const clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
    heroTargetX = clientX - rect.left;
    e.preventDefault();
  }
  canvas.addEventListener('pointerdown', pointerHandler);
  canvas.addEventListener('pointermove', pointerHandler);
  canvas.addEventListener('touchstart', pointerHandler, {passive:false});
  canvas.addEventListener('touchmove', pointerHandler, {passive:false});

  document.addEventListener('keydown', (e)=>{
    if(!playing) return;
    if(e.key === 'ArrowLeft') heroTargetX = Math.max(30, heroTargetX - 40);
    if(e.key === 'ArrowRight') heroTargetX = Math.min(W-30, heroTargetX + 40);
  });

  function spawnItem(){
    const roll = Math.random();
    const type = roll < 0.20 ? 'meteor' : (roll < 0.44 ? 'cat' : 'star');
    const x = 30 + Math.random()*(W-60);
    const speedBase = 85 + Math.min(130, elapsed*3);
    items.push({
      type, x, y: -30,
      size: type==='meteor' ? (16+Math.random()*8) : (type==='cat' ? 16 : (13+Math.random()*6)),
      vy: speedBase + Math.random()*40,
      rot: Math.random()*Math.PI*2,
      rotSpeed: (-2+Math.random()*4),
      wobble: Math.random()*Math.PI*2
    });
  }

  function spawnParticles(x,y,color,count){
    for(let i=0;i<count;i++){
      const a = Math.random()*Math.PI*2;
      const sp = 60 + Math.random()*120;
      particles.push({
        x,y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
        life: 0.5+Math.random()*0.3, age:0, size: 2+Math.random()*3, color
      });
    }
  }

  let shakeT = 0;
  function triggerShake(){
    shakeT = 0.25;
    vignette.style.background = 'radial-gradient(circle, transparent 40%, rgba(200,40,40,.35) 100%)';
    setTimeout(()=>{ vignette.style.background='radial-gradient(circle, transparent 60%, rgba(200,40,40,0) 100%)'; },160);
  }

  function showCombo(n){
    if(n < 3) return;
    comboText.textContent = '×' + toFa(n) + ' 🔥';
    comboText.style.transition = 'none';
    comboText.style.opacity = '1';
    comboText.style.transform = 'translateX(-50%) scale(1.3)';
    requestAnimationFrame(()=>{
      comboText.style.transition = 'opacity .5s ease, transform .5s ease';
      comboText.style.opacity = '0';
      comboText.style.transform = 'translateX(-50%) scale(1)';
    });
  }

  function update(dt){
    elapsed += dt;
    heroX += (heroTargetX - heroX) * Math.min(1, dt*8);
    heroX = Math.max(28, Math.min(W-28, heroX));

    if(heroStateTimer > 0){ heroStateTimer -= dt; if(heroStateTimer<=0) heroState='idle'; }

    const spawnInterval = Math.max(0.34, 0.72 - elapsed*0.011);
    spawnAcc += dt;
    if(spawnAcc >= spawnInterval){ spawnAcc = 0; spawnItem(); }

    const heroY = H*heroY_ratio;
    for(let i=items.length-1;i>=0;i--){
      const it = items[i];
      it.y += it.vy*dt;
      it.rot += it.rotSpeed*dt;
      it.wobble += dt*3;
      it.x += Math.sin(it.wobble)*0.4;

      const dx = it.x - heroX, dy = it.y - heroY;
      const hitDist = it.type==='meteor' ? 34 : (it.type==='cat' ? 36 : 30);
      if(Math.abs(dy) < hitDist*0.6 && Math.abs(dx) < hitDist){
        if(it.type === 'star'){
          score += 1; combo += 1; starsCaught += 1;
          scoreBox.textContent = 'امتیاز: ' + toFa(score);
          spawnParticles(it.x, it.y, '#ffcf5c', 10);
          heroState='happy'; heroStateTimer=0.4;
          showCombo(combo);
        } else if(it.type === 'cat'){
          score += 2; combo += 1; catsSaved += 1;
          scoreBox.textContent = 'امتیاز: ' + toFa(score);
          spawnParticles(it.x, it.y, '#ff8fab', 12);
          heroState='happy'; heroStateTimer=0.4;
          showCombo(combo);
        } else {
          score = Math.max(0, score-2); combo = 0;
          scoreBox.textContent = 'امتیاز: ' + toFa(score);
          spawnParticles(it.x, it.y, '#c9c2cc', 8);
          heroState='startled'; heroStateTimer=0.5;
          triggerShake();
        }
        items.splice(i,1);
        continue;
      }
      if(it.y > H+60) items.splice(i,1);
    }

    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.age += dt;
      if(p.age >= p.life){ particles.splice(i,1); continue; }
      p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 200*dt;
    }

    if(shakeT>0) shakeT -= dt;
  }

  function render(t){
    ctx.clearRect(0,0,W,H);
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#140b2e'); g.addColorStop(1,'#2a1657');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    bgStars.forEach(s=>{
      const tw = 0.5 + 0.5*Math.sin(t*s.speed + s.phase);
      ctx.globalAlpha = 0.3 + tw*0.7;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    items.forEach(it=>{
      ctx.save();
      ctx.translate(it.x, it.y);
      if(it.type==='star'){
        ctx.rotate(it.rot);
        const glow = ctx.createRadialGradient(0,0,0,0,0,it.size*2.2);
        glow.addColorStop(0,'rgba(255,207,92,.55)');
        glow.addColorStop(1,'rgba(255,207,92,0)');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(0,0,it.size*2.2,0,Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ffcf5c';
        drawStarShape(ctx, it.size);
        ctx.fill();
      } else if(it.type==='cat'){
        const glow = ctx.createRadialGradient(0,0,0,0,0,it.size*1.8);
        glow.addColorStop(0,'rgba(255,143,171,.35)');
        glow.addColorStop(1,'rgba(255,143,171,0)');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(0,0,it.size*1.8,0,Math.PI*2); ctx.fill();
        drawRescueCat(ctx, t, 1);
      } else {
        drawMeteor(ctx, it.size, t);
      }
      ctx.restore();
    });

    particles.forEach(p=>{
      const alpha = 1 - p.age/p.life;
      ctx.globalAlpha = Math.max(0,alpha);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    const heroY = H*heroY_ratio;
    let sx=0, sy=0;
    if(shakeT>0){ sx=(Math.random()-0.5)*8; sy=(Math.random()-0.5)*8; }
    ctx.save();
    ctx.translate(heroX+sx, heroY+sy);
    drawHero(ctx, t, heroState, 1.1);
    ctx.restore();
  }

  let rafId = null;
  function loop(ts){
    if(!playing) return;
    if(!lastTs) lastTs = ts;
    const dt = Math.min(0.05, (ts-lastTs)/1000);
    lastTs = ts;
    update(dt);
    render(ts/1000);
    rafId = requestAnimationFrame(loop);
  }

  let countdownId = null;
  function startGame(){
    friendName = nameInput.value.trim();
    previewRunning = false;
    resetGame();
    nameScreen.classList.add('hidden');
    endScreen.classList.add('hidden');
    gameWrap.classList.remove('hidden');
    playing = true; lastTs = 0;
    rafId = requestAnimationFrame(loop);
    countdownId = setInterval(()=>{
      timeLeft -= 1;
      timerEl.textContent = toFa(Math.max(0,timeLeft));
      if(timeLeft <= 0) endGame();
    },1000);
  }

  // ================= END SCREEN =================
  const endCanvas = document.getElementById('endCanvas');
  const ectx = endCanvas.getContext('2d');
  let endRunning = false;
  function endLoop(ts){
    if(!endRunning) return;
    ectx.clearRect(0,0,260,150);
    ectx.save(); ectx.translate(85,75); drawBigStarChar(ectx, ts/1000, 1); ectx.restore();
    ectx.save(); ectx.translate(178,88); drawMonkeyChar(ectx, ts/1000, 1.15); ectx.restore();
    requestAnimationFrame(endLoop);
  }

  function endGame(){
    playing = false;
    clearInterval(countdownId);
    if(rafId) cancelAnimationFrame(rafId);
    gameWrap.classList.add('hidden');
    endScreen.classList.remove('hidden');

    const name = friendName ? friendName : '';
    finalMsg.textContent = name
      ? `آفرین ${name} قهرمان! کارت عالی بودش. تولدت مبارک، قوی‌ترین قهرمان دنیا! 🎉`
      : `آفرین قهرمان! کارت عالی بودش. تولدت مبارک، قوی‌ترین قهرمان دنیا! 🎉`;
    scoreLine.textContent = `${toFa(starsCaught)} ستاره جمع کردی و ${toFa(catsSaved)} گربه نجات دادی ✨🐱`;

    endRunning = true;
    requestAnimationFrame(endLoop);
    launchConfetti();
  }

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('againBtn').addEventListener('click', ()=>{
    endRunning = false;
    endScreen.classList.add('hidden');
    startGame();
  });
  nameInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') startGame(); });

  function launchConfetti(){
    const c = document.getElementById('confettiCanvas');
    c.width = c.clientWidth; c.height = c.clientHeight;
    const cctx = c.getContext('2d');
    const colors = ['#ffcf5c','#ff4d6d','#5be6d0','#fdf3e3'];
    const pieces = Array.from({length:90},()=>({
      x: Math.random()*c.width, y: -20-Math.random()*c.height,
      w: 6+Math.random()*6, h: 8+Math.random()*10,
      color: colors[Math.floor(Math.random()*colors.length)],
      speed: 2+Math.random()*3, drift: -1+Math.random()*2,
      rot: Math.random()*360, rotSpeed: -6+Math.random()*12
    }));
    let frame=0;
    function draw(){
      if(frame++ > 260 || !endRunning){ cctx.clearRect(0,0,c.width,c.height); return; }
      cctx.clearRect(0,0,c.width,c.height);
      pieces.forEach(p=>{
        p.y+=p.speed; p.x+=p.drift; p.rot+=p.rotSpeed;
        if(p.y>c.height+20){ p.y=-20; p.x=Math.random()*c.width; }
        cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.rot*Math.PI/180);
        cctx.fillStyle=p.color; cctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cctx.restore();
      });
      requestAnimationFrame(draw);
    }
    draw();
  }

  resize();
  window.addEventListener('orientationchange', ()=>setTimeout(resize,200));
})();
</script>
</body>
